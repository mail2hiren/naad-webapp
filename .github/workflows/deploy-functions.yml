name: Deploy edge functions

# transcribe-and-extract deploys from this repo, never by hand: every push to
# main that touches it re-runs the contract tests and then deploys it to the
# production Supabase project. Needs the repository secret
# SUPABASE_ACCESS_TOKEN (a Supabase personal access token); without it the
# job warns and skips the deploy step.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/transcribe-and-extract/**'
      - 'supabase/config.toml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: linxtliatqpoaqbflwvh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:functions
      - if: env.SUPABASE_ACCESS_TOKEN == ''
        run: echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so transcribe-and-extract was NOT deployed."
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: env.SUPABASE_ACCESS_TOKEN != ''
        run: supabase functions deploy transcribe-and-extract --project-ref "$SUPABASE_PROJECT_REF" --use-api
