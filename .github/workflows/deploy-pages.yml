name: Deploy to GitHub Pages

# Free hosting straight from this repo: every push to main builds the app and
# publishes it. One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# Optional custom domain: add it under Settings -> Pages (and set the repo
# variable PAGES_BASE_PATH to "/" so assets load from the domain root).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Project pages live at /<repo>/; override with a repo variable for a custom domain.
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/', github.event.repository.name) }}
        run: npm run build
      # SEC06: the demo password and the mock seed must never ship in the live
      # bundle. Fails the deploy if either shows up.
      - name: Keep demo credentials out of the build
        run: |
          if grep -rIl --include='*.js' -e 'pass1234' dist; then
            echo "::error::demo password found in the production bundle"; exit 1
          fi
      # GitHub Pages has no SPA rewrites: serve the app shell for unknown paths
      # (deep links like /doctor, /patient) by duplicating it as 404.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
